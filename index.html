<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Une question ✨</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ====== À MODIFIER ====== voir aussi CONFIG dans le script en bas */
  :root {
    --bg1: #0b1033;
    --bg2: #3a1f6b;
    --gold: #ffd76a;
    --pink: #ff7eb6;
    --text: #fdf7ff;
    --muted: #c9bde6;
    --card: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at bottom, var(--bg2) 0%, var(--bg1) 70%);
    background-color: var(--bg1);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle { 0%, 100% { opacity: .2 } 50% { opacity: 1 } }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 340px;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, .15);
    border-radius: 20px;
    padding: 24px 18px;
    text-align: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .emoji { font-size: 40px; line-height: 1; margin-bottom: 8px; }
  h1 { font-size: 22px; line-height: 1.25; font-weight: 700; margin-bottom: 6px; }
  h1 .name { color: var(--gold); }
  p.sub { color: var(--muted); font-size: 15px; margin-bottom: 20px; }

  .buttons { display: flex; gap: 12px; justify-content: center; align-items: center; min-height: 56px; }
  button {
    font-family: inherit; font-weight: 600; font-size: 16px;
    border: none; border-radius: 999px; padding: 10px 22px; cursor: pointer;
    transition: transform .2s ease;
  }
  #yes { background: var(--gold); color: #2a1650; box-shadow: 0 0 20px rgba(255, 215, 106, .5); }
  #no {
    background: rgba(255, 255, 255, .18); color: var(--text);
    border: 1px solid rgba(255, 255, 255, .25);
    white-space: nowrap; z-index: 5;
  }
  /* En fuite, le bouton Non est déplacé dans <body> : dans la carte, le flou (backdrop-filter)
     servirait de repère à position: fixed et le bouton sortirait de l'écran. */
  #no.flee { position: fixed; transition: left .25s ease, top .25s ease; }

  .step { display: none; }
  .step.active { display: block; animation: pop .4s ease; }
  @keyframes pop { from { opacity: 0; transform: scale(.95) } to { opacity: 1; transform: none } }

  label { display: block; text-align: left; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  input, textarea {
    width: 100%; font-family: inherit; font-size: 16px;
    background: rgba(255, 255, 255, .1); color: var(--text);
    border: 1px solid rgba(255, 255, 255, .2); border-radius: 12px; padding: 10px;
  }
  input::-webkit-calendar-picker-indicator { filter: invert(1); }
  textarea { min-height: 70px; resize: vertical; }
  #send { margin-top: 18px; width: 100%; background: var(--gold); color: #2a1650; }
  #send:disabled { opacity: .6; }
  .error { color: var(--pink); font-size: 14px; margin-top: 10px; min-height: 18px; }

  .confetti { position: fixed; top: -40px; font-size: 24px; pointer-events: none; z-index: 10; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<main class="card" id="card">
  <!-- Étape 1 : la question -->
  <section class="step active" id="step1">
    <div class="emoji">🏰</div>
    <h1><span class="name" id="name"></span>, tu viens à Disneyland avec moi ?</h1>
    <p class="sub">Les files d'attente, je ne garantis pas. Les sensations, oui.</p>
    <div class="buttons">
      <button id="yes">Oui</button>
      <button id="no">Non</button>
    </div>
  </section>

  <!-- Étape 2 : la date + un petit mot -->
  <section class="step" id="step2">
    <div class="emoji">🎢</div>
    <h1>Je savais que tu n'avais pas peur 😁</h1>
    <p class="sub">Dis-moi quand tu es dispo.</p>
    <label for="date">Une date qui t'irait</label>
    <input type="date" id="date">
    <label for="msg">Un petit mot (facultatif)</label>
    <textarea id="msg" placeholder="..."></textarea>
    <button id="send">Envoyer ✨</button>
    <div class="error" id="error"></div>
  </section>

  <!-- Étape 3 : merci -->
  <section class="step" id="step3">
    <div class="emoji">✨</div>
    <h1>C'est noté !</h1>
    <p class="sub" style="margin-bottom:0">Prépare-toi pour les sensations fortes.</p>
  </section>
</main>

<script>
  // ====== À MODIFIER ======
  const CONFIG = {
    name: "Léa",
    // L'alias aléatoire que FormSubmit t'envoie après activation (jamais ton adresse mail : la page est publique)
    email: "206a44efff94b09c9a484cb71da8c13f",
  };
  // ========================

  document.getElementById("name").textContent = CONFIG.name;

  // Étoiles en fond
  const stars = document.getElementById("stars");
  for (let i = 0; i < 80; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = Math.random() * 3 + "s";
    stars.appendChild(s);
  }

  // Le bouton Non qui s'enfuit
  const card = document.getElementById("card");
  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const noTexts = [
    "T'es sûre ?", "Raté 😁", "Ta Dacia dirait oui", "Peur des sensations fortes ?", "Le bouton est en panne",
    "Essaie encore", "Toujours pas", "Presque !", "Tu vas y arriver... ou pas",
    "Mickey est déçu", "Le Non est en pause déj", "Ce bouton n'existe pas",
    "Réfléchis encore 🤔", "Erreur 404 : Non introuvable", "Plus vite que toi 😏",
  ];
  const MARGIN = 12;
  let tries = 0;
  let lastPointerFlee = 0;

  function viewport() {
    return {
      w: Math.min(window.innerWidth, document.documentElement.clientWidth),
      h: Math.min(window.innerHeight, document.documentElement.clientHeight),
    };
  }

  function placeNo(x, y) {
    no.style.left = x + "px";
    no.style.top = y + "px";
  }

  // Une place au hasard, toujours dans l'écran, loin de l'ancienne, de préférence hors de la carte
  function pickSpot() {
    const { w, h } = viewport();
    const bw = no.offsetWidth, bh = no.offsetHeight;
    const maxX = Math.max(MARGIN, w - bw - MARGIN);
    const maxY = Math.max(MARGIN, h - bh - MARGIN);
    const cur = no.getBoundingClientRect();
    const cardR = card.getBoundingClientRect();
    const yesR = yes.getBoundingClientRect();
    const hits = (x, y, r, pad) => x < r.right + pad && x + bw > r.left - pad && y < r.bottom + pad && y + bh > r.top - pad;
    const random = () => ({ x: MARGIN + Math.random() * (maxX - MARGIN), y: MARGIN + Math.random() * (maxY - MARGIN) });
    let fallback = null;
    for (let i = 0; i < 40; i++) {
      const p = random();
      if (Math.hypot(p.x - cur.left, p.y - cur.top) < 100) continue;
      if (!hits(p.x, p.y, cardR, 8)) return p;
      if (!fallback && !hits(p.x, p.y, yesR, 12)) fallback = p;
    }
    return fallback || random();
  }

  function flee() {
    tries++;
    if (no.parentElement !== document.body) {
      const r = no.getBoundingClientRect();
      document.body.appendChild(no);
      no.classList.add("flee");
      placeNo(r.left, r.top);
      no.getBoundingClientRect(); // part de sa place actuelle pour que l'animation se voie
    }
    no.textContent = noTexts[(tries - 1) % noTexts.length];
    const p = pickSpot();
    placeNo(p.x, p.y);
    yes.style.transform = "scale(" + Math.min(1 + tries * 0.06, 1.5) + ")";
  }

  no.addEventListener("pointerenter", (e) => {
    if (e.pointerType !== "mouse") return;
    lastPointerFlee = Date.now();
    flee();
  });
  no.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    lastPointerFlee = Date.now();
    flee();
  });
  // Sur téléphone, un appui déclenche pointerdown puis click : on ignore ce click-là (sinon un texte sur deux sauterait)
  no.addEventListener("click", (e) => {
    e.preventDefault();
    if (Date.now() - lastPointerFlee > 800) flee();
  });

  // Si l'écran change de taille (rotation, barre d'adresse), le bouton reste visible
  window.addEventListener("resize", () => {
    if (!no.classList.contains("flee")) return;
    const { w, h } = viewport();
    const r = no.getBoundingClientRect();
    placeNo(
      Math.min(Math.max(MARGIN, r.left), Math.max(MARGIN, w - r.width - MARGIN)),
      Math.min(Math.max(MARGIN, r.top), Math.max(MARGIN, h - r.height - MARGIN))
    );
  });

  function show(id) {
    document.querySelectorAll(".step").forEach((s) => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function confetti() {
    const items = ["✨", "🎢", "🏰", "⭐", "🎆", "💛"];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.textContent = items[Math.floor(Math.random() * items.length)];
      c.style.left = Math.random() * 100 + "vw";
      c.style.animationDuration = 2 + Math.random() * 2 + "s";
      c.style.animationDelay = Math.random() * 0.8 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5000);
    }
  }

  yes.addEventListener("click", () => {
    no.style.display = "none";
    confetti();
    show("step2");
  });

  // Date minimum = aujourd'hui
  const dateInput = document.getElementById("date");
  dateInput.min = new Date().toISOString().slice(0, 10);

  // Envoi du mail via FormSubmit
  const send = document.getElementById("send");
  const error = document.getElementById("error");
  send.addEventListener("click", async () => {
    error.textContent = "";
    if (!dateInput.value) { error.textContent = "Choisis une date 😉"; return; }
    if (!CONFIG.email) { error.textContent = "Le formulaire n'est pas encore branché."; return; }
    send.disabled = true;
    send.textContent = "Envoi...";
    const d = new Date(dateInput.value + "T12:00:00");
    const dateFr = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    try {
      const res = await fetch("https://formsubmit.co/ajax/" + CONFIG.email, {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          _subject: "🎢 " + CONFIG.name + " a dit OUI pour Disneyland !",
          _template: "box",
          _captcha: "false",
          Réponse: "OUI",
          Date: dateFr,
          "Petit mot": document.getElementById("msg").value || "(pas de mot)",
          "Tentatives sur le bouton Non": String(tries),
        }),
      });
      if (!res.ok) throw new Error(res.status);
      confetti();
      show("step3");
    } catch (err) {
      send.disabled = false;
      send.textContent = "Envoyer ✨";
      error.textContent = "Oups, ça n'est pas parti. Réessaie dans un instant.";
    }
  });
</script>
</body>
</html>
